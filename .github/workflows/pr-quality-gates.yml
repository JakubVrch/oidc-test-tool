name: PR Quality Gates

"on":
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run typecheck
        run: yarn tsc -b

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run ESLint
        run: yarn eslint .

  prettier:
    name: prettier
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run Prettier check
        run: yarn prettier:check

  knip:
    name: knip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run knip
        run: yarn knip

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run Jest with coverage
        run: yarn test --ci --maxWorkers=4 --coverage

      - name: Add coverage summary
        if: always()
        run: |
          node -e "
          const fs = require('node:fs');
          const path = 'coverage/coverage-summary.json';
          if (!fs.existsSync(path)) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## Coverage\nCoverage summary not found.\n');
            process.exit(0);
          }
          const summary = JSON.parse(fs.readFileSync(path, 'utf8'));
          const total = summary.total || {};
          const lines = [
            '## Coverage',
            '| Metric | Percent | Covered/Total |',
            '| --- | ---: | ---: |',
            `| Lines | ${total.lines?.pct ?? 'n/a'}% | ${total.lines?.covered ?? 'n/a'}/${total.lines?.total ?? 'n/a'} |`,
            `| Statements | ${total.statements?.pct ?? 'n/a'}% | ${total.statements?.covered ?? 'n/a'}/${total.statements?.total ?? 'n/a'} |`,
            `| Functions | ${total.functions?.pct ?? 'n/a'}% | ${total.functions?.covered ?? 'n/a'}/${total.functions?.total ?? 'n/a'} |`,
            `| Branches | ${total.branches?.pct ?? 'n/a'}% | ${total.branches?.covered ?? 'n/a'}/${total.branches?.total ?? 'n/a'} |`,
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines + '\n');
          "

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: ignore

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run Vite build
        run: yarn vite build